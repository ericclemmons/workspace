# Agent meta-repo configuration.
# Run `mise tasks` to list tasks. Run `mise install` to install pinned tools.

[tools]
jq = "latest"
hk = "latest"
pkl = "latest"

[settings]
experimental = true

[env]
HK_MISE = "1"

[hooks]
postinstall = "git config --local include.path ../.gitconfig && hk install --mise"
