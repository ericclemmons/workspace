# Agent workspace configuration.
# Run `mise bootstrap` for first-time setup. Run `mise tasks` to list tasks.

[tools]
jq = "latest"
hk = "latest"
pkl = "latest"
terraform = "latest"

[settings]
experimental = true

[env]
HK_MISE = "1"

[hooks]
postinstall = "git config --local include.path ../.gitconfig && hk install --mise"
